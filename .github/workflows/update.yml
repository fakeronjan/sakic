name: Update SAKIC Ratings

on:
  schedule:
    - cron: '13 17 * * *'   # 17:13 UTC daily - after GRIFFEY (16:53); hockey-reference is in the sports-reference family but we lean on NHL API for daily updates so collision risk is low.
  workflow_dispatch:        # allow manual trigger from GitHub UI

permissions:
  contents: write           # needed for git push

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install cython numpy
          pip install --no-build-isolation -r requirements.txt

      # Ratings cache lives in the Actions cache, NOT git (it's a regenerable
      # build artifact - sakic.py's incremental scratchpad - and re-committing a
      # ~9MB gzip EVERY day, even off-season, bloated the repo ~8.9MB/day). Rolling
      # key + prefix restore-keys: every run writes a fresh entry and restores the
      # most recent prior one. A miss (first run / eviction) is safe: sakic.py
      # rebuilds from scratch.
      - name: Restore ratings cache
        uses: actions/cache/restore@v4
        with:
          path: sakic_ratings.csv.gz
          key: sakic-ratings-${{ github.run_id }}
          restore-keys: sakic-ratings-

      - name: Run ratings engine
        run: python sakic.py

      # Persist the freshly-updated cache for the next run (only reached if
      # sakic.py succeeded, so a failed run never saves a partial cache).
      - name: Save ratings cache
        uses: actions/cache/save@v4
        with:
          path: sakic_ratings.csv.gz
          key: sakic-ratings-${{ github.run_id }}

      # title_odds_cache/ holds per-season Monte Carlo results (playoff_sim.py).
      # Each season is fingerprinted by engine code + its games + ratings, so a
      # stale entry is recomputed automatically - no key bump needed after an
      # engine change. A miss rebuilds everything (~20 min on the runner).
      - name: Restore title-odds cache
        uses: actions/cache/restore@v4
        with:
          path: title_odds_cache
          key: sakic-odds-${{ github.run_id }}
          restore-keys: sakic-odds-

      - name: Generate web data
        run: python generate_data.py

      - name: Save title-odds cache
        uses: actions/cache/save@v4
        with:
          path: title_odds_cache
          key: sakic-odds-${{ github.run_id }}

      - name: Commit and push updated data
        run: |
          git config user.name  "SAKIC Bot"
          git config user.email "sakic-bot@users.noreply.github.com"
          git add loaded_nhl_games.csv all_nhl_games.csv docs/data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update ratings $(date -u '+%Y-%m-%d')"
            # Race-safe push: if another commit landed during this run, rebase
            # the data update on top and retry. Avoids losing a day's data
            # update when a code push lands mid-cron-run.
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed; retrying in 5s..."
              sleep 5
            done
          fi
